<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Logo -->
     <link rel="shortcut icon" href="images/logo.jpg" type="image/x-icon">
    <!-- Fonts Sora -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bebas+Neue&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quattrocento:wght@400;700&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- Fonts Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bebas+Neue&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quattrocento:wght@400;700&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Tailwind CSS -->
     <script src="https://cdn.tailwindcss.com"></script>
    <title>Tarin - Morales Dental Clinic | Quality Dental Care & Appointments</title>
</head>
<body class="min-h-screen flex flex-col bg-[#fefefe]">
    <header class="w-full bg-[#fefefe]">
        <nav class="flex items-center justify-between max-w-7xl mx-auto py-4 px-5">
            <a href="" class="shrink-0">
                <img class="w-20 h-20 rounded-full object-cover shadow-md" src="images/logo.jpg" alt="Tarin Morales Logo">
            </a>

            <ul style="font-family: 'Manrope', sans-serif;" class="flex items-center gap-[2.5rem]">
                <li><a href="#" class="text-md text-gray-600 font-bold transition-all duration-300 hover:text-blue-500">Home</a></li>
                <li><a href="#" class="text-md text-gray-600 font-bold transition-all duration-300 hover:text-blue-500">About Us</a></li>
                <li><a href="#" class="text-md text-gray-600 font-bold transition-all duration-300 hover:text-blue-500">Services</a></li>
                <li><a href="#" class="text-md text-gray-600 font-bold transition-all duration-300 hover:text-blue-500">Why Choose Us</a></li>
                <li><a href="#" class="text-md text-gray-600 font-bold transition-all duration-300 hover:text-blue-500">Testimonials</a></li>
                <li><a href="#" class="text-md text-gray-600 font-bold transition-all duration-300 hover:text-blue-500">Contact</a></li>
            </ul>

            <button style="font-family: 'Manrope', sans-serif;" class="shrink-0 bg-gradient-to-r from-blue-600 via-violet-600 to-fuchsia-600 py-3 px-5 rounded-full">
                <a href="#" class="text-white text-[.95rem] text-center flex items-center gap-2">
                    Appointment
                    <i style="-webkit-text-fill-color: transparent; -webkit-text-stroke: 1px;" class="fa fa-calendar"></i>
                </a>
            </button>
        </nav>
    </header>

    <section style="font-family: 'Manrope', sans-serif;" class="bg-[#fefefe]">
        <div class="max-w-7xl mx-auto">
            <main class="flex items-center gap-[7rem] h-[600px]">
                <div class="text-left flex flex-col">
                    <div class="bg-gray-200/50 w-80 rounded-full px-3 py-1 flex items-center justify-center gap-2">
                        <i class="text-blue-600 font-bold fa fa-plus"></i>
                        <h3 class="text-lg font-bold bg-gradient-to-r from-blue-600 to-[#6d4dbb] bg-clip-text text-transparent">Healthy Smile, Confident You</h3>
                    </div>

                    <div class="mt-[1.5rem]">
                        <h1 class="text-6xl font-bold leading-[4.6rem] tracking-wide">Caring for Your <br> <span class="bg-gradient-to-r from-[#0c4ff5] to-[#b81fc9] bg-clip-text text-transparent">Smile, Every Day</span></h1>
                        <h3 class="text-md text-[#373d52] font-bold">
                            <span class="block">We provide gentle, professional, and quality dental care</span> 
                            <span class="block mt-[.2rem]">for you and your family</span>
                        </h3>
                        
                        <div class="flex items-center gap-[1.3rem]">
                            <button style="font-family: 'Manrope', sans-serif;" class="mt-[2rem] shrink-0 bg-gradient-to-r from-blue-600 via-violet-600 to-fuchsia-600 w-64 h-14 rounded-full">
                                <a href="#" class="text-white text-[1rem] text-center flex items-center justify-center gap-2">
                                    Book an Appointment
                                    <i style="-webkit-text-fill-color: transparent; -webkit-text-stroke: 1px;" class="fa fa-calendar"></i>
                                </a>
                            </button>

                            <button style="font-family: 'Manrope', sans-serif;" class="mt-[2rem] shrink-0 border border-blue-600 w-48 h-14 rounded-full">
                                <a href="#" class="text-[#0c4ff5] font-bold text-[.95rem] text-center flex items-center justify-center gap-2">
                                    <i style="-webkit-text-fill-color: transparent; -webkit-text-stroke: 1px;" class="fa fa-tooth"></i>
                                    Our Services
                                </a>
                            </button>
                        </div>

                        <div class="flex items-center gap-[3rem] mt-[3.5rem]">
                            <div class="flex items-center gap-[.7rem]">
                                <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center">
                                    <i class="fa-solid fa-user-doctor text-xl bg-gradient-to-r from-blue-600 via-violet-600 to-fuchsia-600 bg-clip-text text-transparent"></i>
                                </div>

                                <h3 class="font-bold text-md text-left">
                                    <span class="block">Experienced</span>
                                    <span class="block">Dentists</span>
                                </h3>
                            </div>

                            <div class="flex items-center gap-[.7rem]">
                                <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center">
                                    <i class="fa-solid fa-kit-medical text-xl bg-gradient-to-r from-blue-600 via-violet-600 to-fuchsia-600 bg-clip-text text-transparent"></i>
                                </div>

                                <h3 class="font-bold text-md text-left">
                                    <span class="block">Modern</span>
                                    <span class="block">Equipment</span>
                                </h3>
                            </div>

                            <div class="flex items-center gap-[.7rem]">
                                <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center">
                                    <i class="fa fa-shield-heart text-xl bg-gradient-to-r from-blue-600 via-violet-600 to-fuchsia-600 bg-clip-text text-transparent"></i>
                                </div>

                                <h3 class="font-bold text-md text-left">
                                    <span class="block">Personalized</span>
                                    <span class="block">Care</span>
                                </h3>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="relative h-full overflow-hidden">
                    <img src="images/hero.jpg" alt="Tarin Morales Inside Clinic" class="w-full h-full object-cover">
                    <!-- Left Fade -->
                    <div class="absolute inset-y-0 left-0 w-40 bg-gradient-to-l from-transparent via-white/10 to-white"></div>

                    <!-- Top Fade -->
                    <div class="absolute inset-x-0 top-0 h-28 bg-gradient-to-t from-transparent via-white/10 to-white"></div>

                    <!-- Right Fade -->
                    <div class="absolute inset-y-0 right-0 w-40 bg-gradient-to-r from-transparent via-white/10 to-white"></div>

                    <!-- Bottom Fade -->
                    <div class="absolute inset-x-0 bottom-0 h-28 bg-gradient-to-b from-transparent via-white/10 to-white"></div>
                </div>
            </main>
        </div>
    </section>
</body>
</html>
